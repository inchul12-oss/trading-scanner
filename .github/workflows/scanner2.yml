name: 스캐너2-미 진입신호 체크
on:
  schedule:
    - cron: "35,45,55 13 * * 1-5"
    - cron: "*/5 14 * * 1-5"
    - cron: "0,5,10,15,20,25,30 15 * * 1-5"
    - cron: "0,30 16-20 * * 1-5"
  workflow_dispatch: {}
concurrency:
  group: scanner2
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4
      - name: 파이썬 설치
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: 라이브러리 설치
        run: pip install yfinance
      - name: 진입신호 체크 실행
        run: python scan_scanner2.py
      - name: 결과 커밋
        run: |
          git config user.name "scanner-bot"
          git config user.email "scanner-bot@users.noreply.github.com"
          git add scanner2_result.json
          git diff --staged --quiet || git commit -m "scanner2 결과 갱신 $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          for i in 1 2 3 4 5; do
            if git push; then
              break
            fi
            echo "push 실패(다른 스캐너 워크플로우와 동시 커밋 충돌 가능성) - pull --rebase 후 재시도 $i/5"
            git pull --rebase origin main
            sleep $((RANDOM % 5 + 1))
          done
      - name: 텔레그램 진입신호 전송
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: python send_telegram2.py
