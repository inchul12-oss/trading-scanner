name: 눌림목 스캐너

on:
  schedule:
    # 12:00 UTC = 한국시간 21:00 (평일). 미국장 열기 전
    - cron: "0 12 * * 1-5"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 라이브러리 설치
        run: pip install -q yfinance pandas numpy

      - name: 스캔 + 텔레그램 전송
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: python s1_scan.py

      - name: 결과 저장
        run: |
          git config user.name "scanner-bot"
          git config user.email "scanner-bot@users.noreply.github.com"
          git add s1_result.json s1_positions.json log/
          git diff --staged --quiet || git commit -m "눌림목 후보 갱신 $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          for i in 1 2 3 4 5; do
            if git push; then break; fi
            git pull --rebase origin main
            sleep $((RANDOM % 5 + 1))
          done
