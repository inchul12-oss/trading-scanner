name: 스캐너1-미 프리마켓 스캔

on:
  schedule:
    # UTC 기준. 12:00,12:30,13:00,13:30 UTC = 한국시간 21:00,21:30,22:00,22:30
    - cron: "0,30 12,13 * * 1-5"
  workflow_dispatch: {}  # 수동으로도 실행 가능하게

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: 파이썬 설치
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 라이브러리 설치
        run: pip install yfinance

      - name: 스캔 실행
        run: python scan_scanner1.py

      - name: 결과 커밋
        run: |
          git config user.name "scanner-bot"
          git config user.email "scanner-bot@users.noreply.github.com"
          git add scanner1_result.json
          git diff --staged --quiet || git commit -m "scanner1 결과 갱신 $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push
      - name: 텔레그램 메시지 전송
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: python send_telegram.py
