name: Live Scanner Check

# 운영 중인 단타 시스템 검증. 수동 실행 전용.
# 돌아가는 스캐너 워크플로우와 완전히 분리돼 있어서 이 파일이 실패해도
# 실제 매매 봇에는 아무 영향이 없다.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 패키지 설치
        run: pip install --quiet yfinance pandas

      - name: 분석 실행
        run: python analyze_live.py

      - name: 결과 커밋
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add live_analysis.json
          git diff --staged --quiet || git commit -m "라이브 스캐너 검증 결과"
          for i in 1 2 3; do
            git pull --rebase origin main && git push origin main && break
            sleep 5
          done
